name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
      - uses: actions/dependency-review-action@v4
        if: github.event_name != 'pull_request'
        with:
          base-ref: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.event.repository.default_branch }}
          head-ref: ${{ github.sha }}

  security-audit:
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libext2fs-dev libzfslinux-dev
      - if: runner.os == 'Linux'
        name: Build pinned OpenZFS reader
        run: python packaging/tools/build-zfs-reader.py --project-root . --target-dir target/release
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --bins --release --locked
      - name: Build isolated Windows GUI fixture
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p neutra-core --example gui_fixture
      - name: Check clean-Windows runtime dependencies
        if: runner.os == 'Windows'
        run: ./packaging/windows/check-runtime.ps1 -BinaryDirectory target/release
      - name: Compile Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { choco install innosetup --yes --no-progress }
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler is unavailable' }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $binDir = (Resolve-Path 'target/release').Path
          $outputDir = Join-Path $env:RUNNER_TEMP 'neutrasearch-installer'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          & $compiler "/DAppVersion=$version" "/DBinDir=$binDir" "/DOutputDir=$outputDir" 'packaging/windows/neutrasearch.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
      - run: cargo run --release --locked --bin neutrasearch -- --version
      - run: cargo run --release --locked --bin neutrasearch -- index --help
      - run: cargo run --release --locked --bin neutrasearch -- search --help
      - run: cargo run --release --locked --bin neutrasearch-helper -- --version
      - run: cargo run --release --locked --bin neutrasearch-helper -- --build
      - name: Keep Windows binaries for isolated VM checks
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-service-qa
          path: |
            target/release/neutrasearch.exe
            target/release/neutrasearch-helper.exe
            target/release/neutrasearch-query.exe
            target/release/examples/gui_fixture.exe
            ${{ runner.temp }}/neutrasearch-installer/*.exe
          retention-days: 3
      - name: Reject directory-walking APIs in native lanes
        if: runner.os == 'Linux'
        shell: bash
        run: bash packaging/tools/check-no-walk.sh
