name: publish-pi-package

on:
  workflow_dispatch:
  push:
    tags:
      - 'pi-neutrasearch-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-pi-neutrasearch
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Use current npm CLI for trusted publishing
        run: npm install --global npm@12.2.0
      - name: Test package
        run: npm test
        working-directory: packages/pi-neutrasearch
      - name: Verify package contents
        run: npm pack --dry-run
        working-directory: packages/pi-neutrasearch
      - name: Require the platform packages to be published first
        working-directory: packages/pi-neutrasearch
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const deps = require("./package.json").optionalDependencies || {};
            let missing = 0;
            for (const [name, version] of Object.entries(deps)) {
              try { execFileSync("npm", ["view", name + "@" + version, "version"], { stdio: "pipe" }); }
              catch { console.error("not published: " + name + "@" + version); missing++; }
            }
            process.exit(missing ? 1 : 0);
          '
      - name: Publish public Pi package
        run: npm publish --access public --provenance
        working-directory: packages/pi-neutrasearch
