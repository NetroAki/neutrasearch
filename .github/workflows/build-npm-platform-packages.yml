name: build-npm-platform-packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Neutrasearch binary package version
        required: true
        default: '0.1.31'
      publish:
        description: Publish platform packages to npm (trusted publishing)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: neutrasearch-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package: neutrasearch-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: neutrasearch-windows-x64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            package: neutrasearch-darwin-x64
          - os: macos-14
            target: aarch64-apple-darwin
            package: neutrasearch-darwin-arm64
    runs-on: ${{ matrix.os }}
    environment: npm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Require the version to match the workspace
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          workspace=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if [ "$workspace" != "$INPUT_VERSION" ]; then
            echo "input $INPUT_VERSION does not match workspace $workspace" >&2
            exit 1
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libext2fs-dev libzfslinux-dev
      - if: runner.os == 'Linux'
        name: Build pinned OpenZFS reader
        run: python packaging/tools/build-zfs-reader.py --project-root . --target-dir "target/${{ matrix.target }}/release"
      - name: Verify native runner
        run: python packaging/tools/package_release.py verify-host --target "${{ matrix.target }}"
      - name: Build native applications
        run: cargo build --workspace --bins --release --locked --target "${{ matrix.target }}"
      - name: Smoke native applications
        run: cargo run --release --locked --target "${{ matrix.target }}" --bin neutrasearch -- --version
      - name: Prepare platform npm package
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: >-
          python packaging/tools/package_release.py npm-platform
          --project-root .
          --target-dir "target/${{ matrix.target }}/release"
          --output-dir dist/npm
          --target "${{ matrix.target }}"
          --version "$INPUT_VERSION"
      - name: Pack platform npm package
        run: npm pack
        working-directory: dist/npm/${{ matrix.package }}
      - name: Publish platform npm package
        if: inputs.publish
        run: >-
          npm install --global npm@12.2.0 &&
          npm publish --access public --provenance
        working-directory: dist/npm/${{ matrix.package }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-${{ matrix.package }}
          path: dist/npm/${{ matrix.package }}/*.tgz
          if-no-files-found: error
          retention-days: 7
