[package]
name = "neutra-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "neutrasearch"
path = "src/main.rs"

[dependencies]
neutra-core.workspace = true
neutra-remote = { path = "../neutra-remote" }
anyhow.workspace = true
libc.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
regex = "1"
global-hotkey = "0.8"
zstd.workspace = true
arboard = { version = "3", default-features = false }
eframe = { version = "0.34", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui = "0.34"
winit = { version = "0.30.13", default-features = false, features = ["x11", "wayland"] }
raw-window-handle = "0.6"
x11rb = "0.13"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
egui_expressive = { git = "https://github.com/NetroAki/egui_expressive.git", rev = "53de00ecaad9825c0ea4fbd89c95f2621d92a104", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
